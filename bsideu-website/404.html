<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — B-SideU Services</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@400;600&family=Space+Mono:wght@700&display=swap" />
<style>
:root{--bg:#faf7f0;--fg:#151210;--red:#cc0000;--muted:#6d645b;--line:rgba(21,18,16,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--fg:#f6f2eb;--red:#ff4a3d;--muted:#a79d92;--line:rgba(246,242,235,.16)}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;background:var(--bg);color:var(--fg);
     font-family:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;text-align:center}
.mark{height:34px;width:auto;margin-bottom:34px}
@media (prefers-color-scheme:dark){.mark{filter:brightness(1.45) saturate(1.15)}}
.code{font-family:"Space Mono",ui-monospace,monospace;font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
h1{font-family:"Archivo Black",ui-sans-serif,system-ui,sans-serif;font-weight:400;font-size:clamp(2.3rem,8vw,3.6rem);line-height:1;letter-spacing:-.025em;margin:16px 0 0}
p{color:var(--muted);max-width:44ch;margin:18px auto 0}
.row{display:flex;flex-wrap:wrap;gap:11px;justify-content:center;margin-top:32px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;border-radius:999px;
      text-decoration:none;font-weight:600;border:1.5px solid transparent;transition:transform .18s,background .18s}
a.btn:hover{transform:translateY(-2px)}
.p{background:var(--red);color:#fff}
.g{border-color:var(--line);color:var(--fg)}
</style>
</head>
<body>
  <main>
    <img class="mark" src="assets/logo-mark.svg" alt="B-SideU Services" />
    <p class="code">Error 404 · No signal</p>
    <h1>This track<br />isn't on the record.</h1>
    <p>The page you were looking for has moved or never existed. Head back to the main page, or just call us — that always works.</p>
    <div class="row">
      <a class="btn p" href="/">Back to the site</a>
      <a class="btn g" href="tel:+15188606263">Call (518) 860-6263</a>
    </div>
  </main>
</body>
</html>
